# apphosting.yaml

env:
  # Firebase web app config - not secret (these are public client-side
  # identifiers restricted by Firebase Security Rules, same as any other
  # Firebase web app), safe to commit. Needed at BUILD time since
  # NEXT_PUBLIC_ vars get baked into the client bundle by Next.js; included
  # at RUNTIME too since server-rendered pages also import lib/firebase.ts.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBnl4d7DJ6qY7i08hTBiISWS9f6L5wiou0"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "blum-ai-tool.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "blum-ai-tool"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "blum-ai-tool.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "336576487737"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:336576487737:web:9eb3c22f94d23159e388e8"
    availability:
      - BUILD
      - RUNTIME

  # Public Web Push key (not secret - safe to commit, same as the Firebase
  # web config already hardcoded in lib/firebase.ts). Needed at BUILD time
  # since NEXT_PUBLIC_ vars get baked into the client bundle by Next.js.
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: "BGECgfDNoz2PgoBLCfkiLKsV-IFSVhTRUzfOQhz7PIBo5SPX3HV66VSf4npLlCjdtp87cJLJwlYSF9O1xyb_Yco"
    availability:
      - BUILD
      - RUNTIME

# Keep one container warm at all times so visitors never hit a cold-start
# delay (a few extra seconds on the very first request after the app has
# been idle). Under Firebase's default request-based billing this only
# costs idle-memory charges (~$2-4/month at the default 512MiB instance
# size) - CPU is still only billed while actively handling a request.
runConfig:
  minInstances: 1
